name: Check Cloudflare CMS
on:
  push:
    branches: [main]
    paths: ["cloudflare/**", ".github/workflows/cloudflare-checks.yml"]
  pull_request:
    paths: ["cloudflare/**", ".github/workflows/cloudflare-checks.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
