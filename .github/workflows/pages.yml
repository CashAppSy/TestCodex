name: Publish app preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Check mobile application
        run: npm test && npm run typecheck
        working-directory: mobile
      - name: Export preview for the repository URL
        working-directory: mobile
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            export WEB_BASE_PATH=""
          else
            export WEB_BASE_PATH="/$REPOSITORY_NAME"
          fi
          npm run export:web
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
